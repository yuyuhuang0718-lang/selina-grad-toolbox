</style></head><body><a class="skip" href="#content">跳到內容</a><header class="topnav wide"><a class="brand" href="index.html"><span class="mark">魚</span><span>SELINA’S STUDY LAB <span class="mini">／ LLM Wiki</span></span></a><nav class="links"><a href="index.html">首頁</a><a href="slides.html">教學簡報</a><a target="_blank" href="https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f" rel="noopener noreferrer">Karpathy 原始概念</a></nav></header><section class="wide wikihead"><div class="eyebrow">KNOWLEDGE BASE · WEEK 10</div><h1>AI 輔助學術文獻查核 Wiki</h1><p class="muted">不是「AI 說有來源」就相信。從正式論文書目、可查核的主張到維持知識一致性，建立能持續累積的學術查核筆記。</p><div class="stats"><span>05 篇研究論文</span><span>06 張概念頁</span><span>01 個 Query 成果</span><span>Ingest → Query → Lint</span></div></section><div class="wide layout" id="content"><aside class="box sidebar"><label for="search"><b>搜尋 Wiki</b></label><input class="search" id="search" type="search" placeholder="例如 DOI、RAG、引用..." autocomplete="off"><div class="filter" role="group" aria-label="資料類型篩選"><button class="active" data-filter="all">全部</button><button data-filter="paper">論文</button><button data-filter="concept">概念</button></div><div id="count" class="mini count" aria-live="polite"></div><nav class="navitems" id="navitems" aria-label="知識頁列表"></nav><div class="note">本 Wiki 的知識來自已核對的正式論文 metadata 與摘要／方法筆記。原始 PDF 尚待在可連線環境補充；每篇卡片可前往出版社。</div></aside><main class="box article" id="article" tabindex="-1" aria-live="polite"></main></div><script>const DB={"papers": [{"id": "P01", "slug": "Lewis2020-RAG", "title": "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks", "authors": ["Patrick Lewis", "Ethan Perez", "Aleksandra Piktus", "Fabio Petroni", "Vladimir Karpukhin", "Naman Goyal", "Heinrich Küttler", "Mike Lewis", "Wen-tau Yih", "Tim Rocktäschel", "Sebastian Riedel", "Douwe Kiela"], "year": 2020, "venue": "NeurIPS 2020", "doi": null, "arxiv": "2005.11401", "url": "https://papers.nips.cc/paper/2020/file/6b493230205f780e1bc26945df7481e5-Paper.pdf", "landing": "https://arxiv.org/abs/2005.11401", "pdf_url": "https://papers.nips.cc/paper/2020/file/6b493230205f780e1bc26945df7481e5-Paper.pdf", "tags": ["retrieval", "evidence"], "headline": "RAG：先找到資料，再由模型組織回答", "abstract_note": "RAG 把參數化語言模型與外部文件檢索結合，藉由可更新、可追溯的非參數化記憶支援知識密集型任務。論文展示 RAG-Sequence 與 RAG-Token 兩種對不同文件進行條件化生成的方式。", "evidence": [{"section": "Abstract", "fact": "模型結合 parametric memory 與 non-parametric memory，並比較不同 RAG 公式。"}, {"section": "Section 2.1", "fact": "RAG-Sequence 以同一檢索文件支援整段輸出；RAG-Token 可在不同 token 使用不同文件。"}], "for_workflow": "查核 AI 文字時，先檢索一手論文與官方紀錄，不能只依賴模型原有記憶。", "caveat": "檢索有助於提供依據，但檢索到資料不等於每個生成句子均獲得支持。", "concepts": ["retrieval", "claim-evidence"], "formula": "$$p_{\\mathrm{RAG}}(y\\mid x)\\approx \\sum_{z\\in \\mathrm{top\\mbox{-}k}}p_{\\eta}(z\\mid x)\\,p_{\\theta}(y\\mid x,z)$$", "formula_note": "RAG-Sequence 的教學簡寫；完整公式請以原論文 Section 2.1 為準。"}, {"id": "P02", "slug": "Gao2023-ALCE", "title": "Enabling Large Language Models to Generate Text with Citations", "authors": ["Tianyu Gao", "Howard Yen", "Jiatong Yu", "Danqi Chen"], "year": 2023, "venue": "EMNLP 2023", "doi": "10.18653/v1/2023.emnlp-main.398", "arxiv": "2305.14627", "url": "https://aclanthology.org/2023.emnlp-main.398/", "landing": "https://aclanthology.org/2023.emnlp-main.398/", "pdf_url": "https://aclanthology.org/2023.emnlp-main.398.pdf", "tags": ["citation", "evidence"], "headline": "ALCE：有引用不代表引用正確", "abstract_note": "ALCE 是評估大型語言模型帶引文回答的基準，分別檢視 fluency、correctness 與 citation quality。強調引文必須能支持相應的主張，而非只在段尾出現一個連結。", "evidence": [{"section": "Abstract", "fact": "ALCE 評估 fluency、correctness、citation quality 三個維度。"}, {"section": "Bibliographic record", "fact": "EMNLP 2023 正式 DOI 為 10.18653/v1/2023.emnlp-main.398。"}], "for_workflow": "建立「論點—文獻證據」對照；先查引文真實存在，再查是否支持相應敘述。", "caveat": "DOI 與題名都正確，仍不能代表 AI 對內容的敘述必定正確。", "concepts": ["metadata", "claim-evidence", "citation-quality"], "formula": "", "formula_note": ""}, {"id": "P03", "slug": "Min2023-FActScore", "title": "FActScore: Fine-grained Atomic Evaluation of Factual Precision in Long Form Text Generation", "authors": ["Sewon Min", "Kalpesh Krishna", "Xinxi Lyu", "Mike Lewis", "Wen-tau Yih", "Pang Wei Koh", "Mohit Iyyer", "Luke Zettlemoyer", "Hannaneh Hajishirzi"], "year": 2023, "venue": "EMNLP 2023", "doi": "10.18653/v1/2023.emnlp-main.741", "arxiv": "2305.14251", "url": "https://aclanthology.org/2023.emnlp-main.741/", "landing": "https://aclanthology.org/2023.emnlp-main.741/", "pdf_url": "https://aclanthology.org/2023.emnlp-main.741.pdf", "tags": ["factuality", "atomic-facts"], "headline": "FActScore：把一句話拆成能逐一查核的事實", "abstract_note": "FActScore 將長篇生成文字拆成 atomic facts，檢查這些原子事實是否有可靠知識來源支持，避免將混合正確與錯誤的整段文字只判成對或錯。", "evidence": [{"section": "Abstract", "fact": "將長文本分成 atomic facts，評估由可靠來源支持的比例。"}, {"section": "Bibliographic record", "fact": "EMNLP 2023 正式 DOI 為 10.18653/v1/2023.emnlp-main.741。"}], "for_workflow": "先將 AI 生成的摘要拆成「年份、作者、方法、結論」等可獨立判定的主張，再逐句比對。", "caveat": "本教學使用支持率做入門示例；FActScore 原方法比簡單的支持筆數比例更完整，不能把入門示例視為完整重現論文演算法。", "concepts": ["atomic-facts", "claim-evidence"], "formula": "$$\\mathrm{supported\\ ratio}=\\frac{\\#\\,\\mathrm{supported\\ claims}}{\\#\\,\\mathrm{checked\\ claims}}$$", "formula_note": "教學用的簡化支持比例，並非 FActScore 的完整原始評估公式。"}, {"id": "P04", "slug": "Dhuliawala2024-CoVe", "title": "Chain-of-Verification Reduces Hallucination in Large Language Models", "authors": ["Shehzaad Dhuliawala", "Mojtaba Komeili", "Jing Xu", "Roberta Raileanu", "Xian Li", "Asli Celikyilmaz", "Jason Weston"], "year": 2024, "venue": "Findings of ACL 2024", "doi": "10.18653/v1/2024.findings-acl.212", "arxiv": "2309.11495", "url": "https://aclanthology.org/2024.findings-acl.212/", "landing": "https://aclanthology.org/2024.findings-acl.212/", "pdf_url": "https://aclanthology.org/2024.findings-acl.212.pdf", "tags": ["verification", "loop"], "headline": "CoVe：先擬查核問題，再獨立驗證", "abstract_note": "Chain-of-Verification (CoVe) 以初稿 → 規劃查核問題 → 獨立回答查核問題 → 產生驗證後版本等步驟，降低生成內容中的幻覺。", "evidence": [{"section": "Abstract", "fact": "方法由草稿、驗證問題、獨立作答、最終修正四階段組成。"}, {"section": "Bibliographic record", "fact": "正式發表於 Findings of ACL 2024；2023 是 arXiv 初次預印本年份。"}], "for_workflow": "簡報產生前設置獨立驗證問題，並把驗證失敗的主張退回 Wiki 修正。", "caveat": "驗證迴圈能降低部分錯誤，不能保證完全沒有幻覺。", "concepts": ["loop", "claim-evidence"], "formula": "", "formula_note": ""}, {"id": "P05", "slug": "Asai2024-SelfRAG", "title": "Self-RAG: Learning to Retrieve, Generate, and Critique through Self-Reflection", "authors": ["Akari Asai", "Zeqiu Wu", "Yizhong Wang", "Avirup Sil", "Hannaneh Hajishirzi"], "year": 2024, "venue": "ICLR 2024", "doi": null, "arxiv": "2310.11511", "url": "https://proceedings.iclr.cc/paper_files/paper/2024/hash/25f7be9694d7b32d5cc670927b8091e1-Abstract-Conference.html", "landing": "https://proceedings.iclr.cc/paper_files/paper/2024/hash/25f7be9694d7b32d5cc670927b8091e1-Abstract-Conference.html", "pdf_url": "https://proceedings.iclr.cc/paper_files/paper/2024/file/25f7be9694d7b32d5cc670927b8091e1-Paper-Conference.pdf", "tags": ["retrieval", "reflection"], "headline": "Self-RAG：檢索、生成、反思要互相回饋", "abstract_note": "Self-RAG 使用 reflection tokens，學習在需要時取得外部內容、產生回答並評估相關性、支援程度和有效性。其機制提供「生成不能直接等於發布」的設計啟發。", "evidence": [{"section": "Abstract", "fact": "Self-RAG 強調按需檢索，以及透過自我反思對檢索與生成結果進行評估。"}, {"section": "Official ICLR record", "fact": "正式發表年份 2024；原 arXiv 提交年份為 2023。"}], "for_workflow": "查核失敗時，區分是資料沒找到、資料不相干、還是回答缺乏支持，回到不同節點。", "caveat": "本作業借用 Self-RAG 的反思概念，沒有訓練或重現其模型；不應稱作實作 Self-RAG 演算法。", "concepts": ["retrieval", "loop", "claim-evidence"], "formula": "", "formula_note": ""}], "concepts": {"metadata": {"title": "書目資料與 DOI 查核", "blurb": "驗證論文存在，再核對 title、authors、year、venue、DOI 或 arXiv ID。", "what": "DOI 是辨識文獻的持久識別碼之一。Crossref 可提供會員登錄的書目 metadata；沒有 Crossref DOI 不必然代表論文不存在，仍可使用出版社、會議或 arXiv 官方紀錄查核。", "practical": "逐欄確認題名、第一作者、正式出版年份與出版場域，並將來源網址保存為證據。", "warning": "不要由 AI 猜 DOI；也不要把 arXiv 預印本年份與正式發表年份混為一談。"}, "claim-evidence": {"title": "主張與證據逐句對應", "blurb": "一個 citation 必須能支持放在它旁邊的那個主張。", "what": "將「某論文提出 X 且提升 Y%」拆成「提出 X」與「提升 Y%」兩筆判斷，每筆都找一手來源位置。", "practical": "每筆主張記錄 claim、source_id、section、status（supported／unsupported／pending）。", "warning": "只看到引用連結，不能判斷作者的原意、適用條件和數值是否吻合。"}, "citation-quality": {"title": "Citation Quality", "blurb": "引文存在、書目正確、能支持文字，是三種不同問題。", "what": "ALCE 將 citation quality 與 factual correctness、fluency 分別檢驗；本教學延伸為書目存在與內容支持兩個查核關卡。", "practical": "先確認文獻書目，再檢查引用位置是否真的支持句子。", "warning": "正確 DOI 不等於正確引用；錯誤的引用位置仍會誤導讀者。"}, "atomic-facts": {"title": "Atomic Facts", "blurb": "把長句拆成最小、可逐條查驗的事實單位。", "what": "「2023 年 A 團隊在 EMNLP 提出 B 且超越 C」至少包含年份、作者、場域、提出方法、比較表現等獨立主張。", "practical": "為每個原子主張標註 evidence、status，不把未查證敘述硬塞進最終簡報。", "warning": "教學中不能把「沒有找到支持」直接宣告成「論文證明其錯誤」；應標記待查證。"}, "retrieval": {"title": "Retrieval 與來源回溯", "blurb": "先查到原始來源，再形成結論。", "what": "RAG 提供檢索增強生成的基礎思想；LLM Wiki 則把累積的來源筆記維護成可重用、互相連結的 Markdown 知識。", "practical": "從 wiki/index.md 找適當知識頁，再回到官方論文的 Abstract 或 Methods 對照。", "warning": "Wiki 是整理成果，不應取代原始論文；遇到衝突回原始來源。"}, "loop": {"title": "驗證 Loop 與 Lint", "blurb": "讓錯誤在變成投影片之前就被擋下。", "what": "先做來源 metadata gate，再整理主張，跑 claim lint，最後才產生 HTML；Lint 若失敗則回到對應節點修正。", "practical": "對照參考資料、檢查失效連結、標記待查證與跨頁矛盾，留下修正前後紀錄。", "warning": "Loop 能提升可追溯性但無法保證真實世界完全無誤；人工抽查仍必要。"}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const papers=DB.papers,concepts=DB.concepts;const items=[{type:'overview',id:'overview',label:'總覽｜學術文獻查核'},...papers.map(p=>({type:'paper',id:p.id,label:p.slug,subtitle:p.headline})),...Object.entries(concepts).map(([id,c])=>({type:'concept',id,label:c.title,subtitle:c.blurb}))];let filter='all',active='overview';
function choose(t){active=t;renderNav();renderArticle();document.getElementById('article').focus({preventScroll:true});if(location.hash.slice(1)!==t)history.replaceState(null,'','#'+t)}
function renderNav(){let s=document.getElementById('search').value.trim().toLowerCase();const displayed=items.filter(i=>(filter==='all'||i.type===filter||i.type==='overview')&&(`${i.label} ${i.subtitle||''} ${i.id}`).toLowerCase().includes(s));document.getElementById('count').textContent=`符合條件：${displayed.length} 頁`;const nav=document.getElementById('navitems');nav.replaceChildren();for(let it of displayed){let btn=document.createElement('button');btn.className=active===it.id?'active':'';btn.setAttribute('aria-current',active===it.id?'page':'false');btn.textContent=it.label;if(it.subtitle){let small=document.createElement('small');small.textContent=it.subtitle;btn.append(small)}btn.addEventListener('click',()=>choose(it.id));nav.append(btn)}if(!displayed.length){const p=document.createElement('p');p.className='empty';p.textContent='沒有找到符合的知識頁，請改用其他關鍵字。';nav.append(p)}}
function paperCard(p){return `<div class="box" style="box-shadow:none;padding:17px"><div class="paper-k">${esc(p.id)} · ${p.year} · ${esc(p.venue)}</div><h3>${esc(p.slug)}</h3><p>${esc(p.headline)}</p><button class="btn soft" data-target="${esc(p.id)}" style="font-size:.8rem">閱讀 Wiki 筆記</button></div>`}
function renderArticle(){const el=document.getElementById('article');let body='';if(active==='overview'){body=`<div class="tocsmall">START HERE</div><h1>先問三個問題：<br>它存在嗎？寫對了嗎？真的支持嗎？</h1><p class="muted">根據 Karpathy 的 LLM Wiki pattern，將原始來源與整理後、互相連結的 Markdown 頁面分開保存。每次新增論文都更新索引、概念頁與活動日誌。</p><div class="cols2"><div class="ok"><b>已完成</b><p>5 筆原始來源 snapshot → 5 張論文頁 → 6 張概念頁 → 1 筆教學 Query；含 DOI 負向測試。</p></div><div class="warn"><b>資料邊界</b><p>已查官方書目與摘要；全文 PDF 因下載環境限制尚未匯入，不能宣稱已做所有章節的全文查核。</p></div></div><h2 style="margin-top:27px">第一層：五篇論文（來源）</h2><div class="cardgrid">${papers.map(paperCard).join('')}</div><h2 style="margin-top:27px">第二層：可連結的概念頁</h2><div class="connect">${Object.entries(concepts).map(([id,c])=>`<button data-target="${id}">${esc(c.title)}</button>`).join('')}</div><h2 style="margin-top:27px">第三層：產生簡報前的檢查</h2><div class="evidence">① 資料／Metadata Gate　→　② 概念與主張對照　→　③ Wiki Lint　→　④ HTML 簡報　→　⑤ 瀏覽器操作測試</div><p>「引文存在」與「引文能支持主張」是兩個不同條件。示範使用 P02 正式 DOI <code>10.18653/v1/2023.emnlp-main.398</code>，再用人工注入的錯誤 DOI 驗證早期檢查節點。</p>`}
else if(active.startsWith('P')){const p=papers.find(x=>x.id===active);if(!p){active='overview';renderArticle();return}body=`<div class="tocsmall">${p.id} · SOURCE PAPER</div><h1>${esc(p.title)}</h1><div class="paper-k">${p.year} / ${esc(p.venue)}</div><dl class="meta"><dt>作者</dt><dd>${esc(p.authors.join(', '))}</dd><dt>DOI</dt><dd>${p.doi?`<a href="https://doi.org/${esc(p.doi)}" target="_blank" rel="noopener noreferrer">${esc(p.doi)}</a>`:'無核實出版社 DOI（另有 arXiv ID）'}</dd><dt>arXiv</dt><dd><a target="_blank" rel="noopener noreferrer" href="https://arxiv.org/abs/${esc(p.arxiv)}">${esc(p.arxiv)}</a></dd></dl><h2>一句話摘要</h2><div class="evidence"><b>${esc(p.headline)}</b></div><h2>重點整理</h2><p>${esc(p.abstract_note)}</p><h2>證據定位</h2>${p.evidence.map(e=>`<div class="evidence"><b>${esc(e.section)}</b><p>${esc(e.fact)}</p></div>`).join('')}<h2>對本作業的用途</h2><p>${esc(p.for_workflow)}</p><div class="warn"><b>不可過度推論</b><p>${esc(p.caveat)}</p></div><h2 style="margin-top:25px">連結到概念頁</h2><div class="connect">${p.concepts.map(c=>`<button data-target="${c}">${esc(concepts[c].title)}</button>`).join('')}</div><div class="source-links"><a href="${esc(p.landing)}" target="_blank" rel="noopener noreferrer">官方書目頁 ↗</a><a href="${esc(p.pdf_url)}" target="_blank" rel="noopener noreferrer">原始 PDF 網址 ↗</a></div>`}
else{const c=concepts[active];if(!c){active='overview';renderArticle();return}const related=papers.filter(p=>p.concepts.includes(active));body=`<div class="tocsmall">CONCEPT PAGE</div><h1>${esc(c.title)}</h1><p class="kicker">${esc(c.blurb)}</p><h2>概念</h2><p>${esc(c.what)}</p><h2>如何實際查核</h2><div class="evidence">${esc(c.practical)}</div><div class="warn"><b>常見誤解</b><p>${esc(c.warning)}</p></div><h2 style="margin-top:25px">來源與互聯頁</h2><div class="cardgrid">${related.map(paperCard).join('')}</div>${active==='metadata'?'<div class="source-links"><a target="_blank" rel="noopener noreferrer" href="https://www.crossref.org/documentation/retrieve-metadata/rest-api">Crossref 官方 API 文件 ↗</a></div>':''}`}
el.innerHTML=body;el.querySelectorAll('[data-target]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.target)))}
document.getElementById('search').addEventListener('input',renderNav);document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(t=>t.classList.toggle('active',t===b));renderNav()}));let h=location.hash.substring(1);active=items.some(i=>i.id===h)?h:'overview';renderNav();renderArticle();
</script></body></html>
